apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.ensignsoft.quicksend"
    defaultConfig {
        applicationId "com.ensignsoft.quicksend"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode((System.getenv("QS_VERSION_CODE") ?: "1").toInteger())
        versionName "0.1.0"
        // owner/repo used only by the user-triggered update check; empty disables it.
        def releasesRepo = (System.getenv("QS_RELEASES_REPO") ?: "").replaceAll(/[^A-Za-z0-9_.\/-]/, "")
        buildConfigField "String", "RELEASES_REPO", "\"${releasesRepo}\""
    }
    buildFeatures {
        buildConfig true
    }
    // Release signing comes only from environment variables (CI secrets).
    // Never commit a keystore or passwords; see docs/RELEASE.md.
    def releaseKeystore = System.getenv("QS_KEYSTORE_PATH")
    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv("QS_KEYSTORE_PASSWORD")
                keyAlias System.getenv("QS_KEY_ALIAS")
                keyPassword System.getenv("QS_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    testImplementation("junit:junit:4.13.2")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

project.ext.vectoricons = [iconFontNames: ["MaterialCommunityIcons.ttf"]]
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

def mobileRoot = rootProject.projectDir.parentFile
def quickSendRustRoot = new File(mobileRoot, "rust")
def quickSendRustTargetDir = new File(layout.buildDirectory.get().asFile, "quicksendRust")
def quickSendNativeOutput = layout.buildDirectory.dir("generated/quicksendJniLibs")
def cargoBin = new File(System.getProperty("user.home"), ".cargo/bin")
android.sourceSets.main.jniLibs.srcDir(quickSendNativeOutput.get().asFile)

def ndkBin = new File(android.ndkDirectory, "toolchains/llvm/prebuilt/linux-x86_64/bin")
def rustSources = files(
    fileTree(quickSendRustRoot) { include("Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "src/**/*.rs") },
    fileTree(new File(mobileRoot, "../packages/core")) { include("Cargo.toml", "src/**/*.rs", "assets/**") }
)
def rustTargets = [
    [target: "aarch64-linux-android", abi: "arm64-v8a", clang: "aarch64-linux-android29-clang", task: "compileQuickSendCoreArm64"],
    [target: "x86_64-linux-android", abi: "x86_64", clang: "x86_64-linux-android29-clang", task: "compileQuickSendCoreX64"]
]
def stagingTasks = []
rustTargets.each { config ->
    def output = new File(quickSendRustTargetDir, "${config.target}/release/libquicksend_core.so")
    def compileTask = tasks.register(config.task, Exec) {
        group = "build"
        description = "Compile the Quick Send LocalSend core for ${config.abi}."
        workingDir quickSendRustRoot
        inputs.files(rustSources)
        outputs.file(output)
        environment "CARGO_TARGET_DIR", quickSendRustTargetDir.absolutePath
        environment "PATH", "${cargoBin.absolutePath}${File.pathSeparator}${System.getenv('PATH')}"
        environment "CARGO_TARGET_${config.target.toUpperCase().replace('-', '_')}_LINKER", new File(ndkBin, config.clang).absolutePath
        environment "CC_${config.target.replace('-', '_')}", new File(ndkBin, config.clang).absolutePath
        environment "AR_${config.target.replace('-', '_')}", new File(ndkBin, "llvm-ar").absolutePath
        commandLine "cargo", "build", "--release", "--target", config.target, "--manifest-path", new File(quickSendRustRoot, "Cargo.toml").absolutePath
    }
    def stageTask = tasks.register("stageQuickSendCore${config.abi == 'arm64-v8a' ? 'Arm64' : 'X64'}", Copy) {
        group = "build"
        dependsOn(compileTask)
        from(output)
        into(new File(quickSendNativeOutput.get().asFile, config.abi))
    }
    stagingTasks.add(stageTask)
}
tasks.named("compileQuickSendCoreX64").configure { dependsOn("compileQuickSendCoreArm64") }
tasks.register("buildQuickSendCore") {
    group = "build"
    description = "Build and stage the LocalSend Rust core for Android ABIs."
    dependsOn(stagingTasks)
}

tasks.named("preBuild").configure { dependsOn("buildQuickSendCore") }
