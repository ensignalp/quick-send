name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Dependencies (app)
        working-directory: app
        run: flutter pub get
      - name: Dependencies (cargokit - rust_builder)
        working-directory: packages/localsend_isolates/rust_builder/cargokit/build_tool
        run: flutter pub get
      - name: Remove gen directory (app)
        working-directory: app
        run: rm -rf lib/gen
      - name: Check format (app)
        working-directory: app
        run: dart format --set-exit-if-changed lib test

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Dependencies (app)
        working-directory: app
        run: flutter pub get
      - name: Dependencies (cargokit - rust_builder)
        working-directory: packages/localsend_isolates/rust_builder/cargokit/build_tool
        run: flutter pub get
      - name: Analyze (app)
        working-directory: app
        run: flutter analyze
      - name: Test (app)
        working-directory: app
        run: flutter test
      - name: Dependencies (localsend_isolates)
        working-directory: packages/localsend_isolates
        run: flutter pub get
      - name: Test (localsend_isolates)
        working-directory: packages/localsend_isolates
        run: flutter test

  rust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust
        run: rustup toolchain install --profile minimal # version from rust-toolchain.toml
      - name: Cache
        uses: Swatinem/rust-cache@v2

      # `cargo fmt --check` is deliberately left out: the tree is not
      # rustfmt-clean today, and `frb_generated.rs` never will be.
      #
      # `packages/core` declares its modules unconditionally while their
      # dependencies are optional, so it only builds with a feature set that
      # pulls all of them in.
      - name: Clippy (core)
        working-directory: packages/core
        run: cargo clippy --features full --all-targets
      - name: Test (core)
        working-directory: packages/core
        run: cargo test --features full
      - name: Test (signaling server)
        run: cargo test --package server
      - name: Check (plugin crate, CLI)
        run: cargo check --package rust_lib_localsend_app --package localsend-cli

  packaging:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Extract version from pubspec.yaml
        id: pubspec_version
        run: |
          VERSION=$(grep '^version: ' app/pubspec.yaml | sed 's/version: //' | sed 's/\+.*//')
          echo "Pubspec version is $VERSION"
          echo "pubspec_version=$VERSION" >> $GITHUB_ENV

      - name: Compare Quick Send versions (pubspec, AppImage, Android)
        run: |
          X64=$(grep '^    version: ' support/build/appimage/AppImageBuilder_x86_64.yml | sed 's/    version: //')
          ARM=$(grep '^    version: ' support/build/appimage/AppImageBuilder_arm_64.yml | sed 's/    version: //')
          ANDROID=$(grep -o 'versionName "[^"]*"' mobile/android/app/build.gradle | sed 's/versionName "//;s/"//')
          echo "pubspec=$pubspec_version appimage=$X64/$ARM android=$ANDROID"
          if [ "$pubspec_version" != "$X64" ] || [ "$pubspec_version" != "$ARM" ] || [ "$pubspec_version" != "$ANDROID" ]; then
            echo "Version mismatch detected!"; exit 1
          fi

      - name: Compare Rust toolchain versions
        run: |
          ROOT_TOOLCHAIN=$(grep '^channel = ' rust-toolchain.toml | sed 's/channel = "//' | sed 's/"//')
          PLUGIN_TOOLCHAIN=$(grep '^channel = ' packages/localsend_isolates/rust-toolchain.toml | sed 's/channel = "//' | sed 's/"//')
          echo "Root toolchain is $ROOT_TOOLCHAIN, plugin toolchain is $PLUGIN_TOOLCHAIN"
          if [ "$ROOT_TOOLCHAIN" != "$PLUGIN_TOOLCHAIN" ]; then
            echo "Rust toolchain version mismatch detected!"
            exit 1
          else
            echo "Toolchain versions match."
          fi


  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --runInBand

  mobile-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test JNI bridge crate (host)
        working-directory: mobile/rust
        run: |
          rustup show
          cargo test
