# Quick Send release pipeline: builds signed Android APK/AAB, Linux AppImage
# and RPM, then creates a GitHub Release for tags like v1.0.0.
# Signing material comes only from repository secrets (see docs/RELEASE.md).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.41.9"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager "ndk;27.1.12297006" "platforms;android-37" "build-tools;37.0.0"
      - name: Install Rust Android targets
        working-directory: mobile/rust
        run: rustup show
      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "ANDROID_KEYSTORE_BASE64 secret missing" >&2; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/quicksend.jks"
          echo "QS_KEYSTORE_PATH=$RUNNER_TEMP/quicksend.jks" >> "$GITHUB_ENV"
      - name: Build signed APK and AAB
        working-directory: mobile/android
        env:
          QS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          QS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          QS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          QS_RELEASES_REPO: ${{ github.repository }}
          QS_UPDATE_PUBLIC_KEY: ${{ vars.QS_UPDATE_PUBLIC_KEY }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease
      - name: Collect artifacts
        run: |
          mkdir -p out
          cp mobile/android/app/build/outputs/apk/release/app-release.apk out/Quick-Send-${GITHUB_REF_NAME}-android.apk
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab out/Quick-Send-${GITHUB_REF_NAME}-android.aab
          rm -f "$QS_KEYSTORE_PATH"
      - uses: actions/upload-artifact@v6
        with:
          name: android
          path: out/*

  appimage:
    uses: ./.github/workflows/build_linux_appimage_x64.yml

  rpm:
    runs-on: ubuntu-latest
    container: fedora:43
    steps:
      - name: Install dependencies
        run: dnf install -y git clang cmake gtk3-devel ninja-build libayatana-appindicator-gtk3-devel jq findutils which xz unzip patchelf rpm-build desktop-file-utils rustup
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install Rust
        run: |
          rustup-init -y --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build Flutter Linux bundle
        working-directory: app
        run: |
          git config --global --add safe.directory '*'
          flutter pub get
          # Newer libayatana marks tray_manager's API deprecated; don't fail on it.
          export CXXFLAGS=-Wno-error=deprecated-declarations
          flutter build linux --release --dart-define=QS_RELEASES_REPO=${{ github.repository }} --dart-define=QS_UPDATE_PUBLIC_KEY=${{ vars.QS_UPDATE_PUBLIC_KEY }}
          sh ../support/build/linux/bundle-internet-helper.sh
      - name: Build RPM
        run: packaging/rpm/build-rpm.sh
      - uses: actions/upload-artifact@v6
        with:
          name: rpm
          path: build/rpm/RPMS/x86_64/*.rpm

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, appimage, rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - name: Sign checksums (background updates verify this signature)
        working-directory: dist
        env:
          QS_UPDATE_SIGNING_KEY: ${{ secrets.QS_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$QS_UPDATE_SIGNING_KEY" ]; then
            echo "QS_UPDATE_SIGNING_KEY secret missing: releases will not be installed by background updates" >&2
            exit 0
          fi
          umask 077
          printf '%s\n' "$QS_UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/update-key.pem"
          openssl dgst -sha256 -sign "$RUNNER_TEMP/update-key.pem" -out SHA256SUMS.txt.sig SHA256SUMS.txt
          openssl ec -in "$RUNNER_TEMP/update-key.pem" -pubout -out "$RUNNER_TEMP/update-pub.pem"
          openssl dgst -sha256 -verify "$RUNNER_TEMP/update-pub.pem" -signature SHA256SUMS.txt.sig SHA256SUMS.txt
          rm -f "$RUNNER_TEMP/update-key.pem"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release published by hand (tested local artifacts) is left alone.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; not replacing its assets."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Quick Send $GITHUB_REF_NAME" --generate-notes
